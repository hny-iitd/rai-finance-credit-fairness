[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rai-finance-credit-fairness"
version = "0.1.0"
description = "Responsible AI audit of credit-approval models: fairness, explainability, robustness and business impact."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "GITHUB_USERNAME" }]
dependencies = [
    "rai-metrics-core @ git+https://github.com/GITHUB_USERNAME/rai-metrics-core.git",
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "matplotlib>=3.6",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
